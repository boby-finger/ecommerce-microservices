server:
  port: 8091

services:
  internal-api-key: ${INTERNAL_API_KEY}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${services.auth.url}
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: ${services.user.url}
              predicates:
                - Path=/api/v1/users/**

            - id: order-service
              uri: ${services.order.url}
              predicates:
                - Path=/api/v1/orders/**

            - id: payment-service
              uri: ${services.payment.url}
              predicates:
                - Path=/api/v1/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health, gateway
  endpoint:
    health:
      probes:
        enabled: true