services:
  redis:
    image: redis:7-alpine
    container_name: user_service_redis

    ports:
      - "${REDIS_PORT}:6379"

  postgres-db:
    image: postgres:16-alpine
    container_name: user_service_db

    ports:
      - "${DB_PORT}:5432"

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: