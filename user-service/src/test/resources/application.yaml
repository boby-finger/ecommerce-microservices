security:
  jwt:
    jwk-set-uri: http://localhost:8002/oauth2/jwks
    issuer: authentication-service
  internal-api-key: test-internal-key

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP_WITH_TIMEZONE
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cache:
    type: none