security:
  jwt:
    jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8002/oauth2/jwks}

spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    show-sql: false